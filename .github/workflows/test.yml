name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab for debugging
  workflow_dispatch:

# Cancel previous runs of the same workflow on the same branch when a new
# commit is pushed — saves CI minutes and feedback latency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    name: Headless tests (Godot 4.6.2)

    env:
      GODOT_VERSION: "4.6.2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot ${{ env.GODOT_VERSION }} (if not cached)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Verify Godot version
        run: godot --version

      - name: Import project (build class registry)
        working-directory: hoardseeker
        # Import can exit non-zero for non-fatal reasons (warnings, missing
        # imported resources on first run). Don't fail the build here — the
        # test step is the real signal.
        run: godot --headless --import || true

      - name: Run headless tests
        working-directory: hoardseeker
        run: godot --headless --script tests/test_runner.gd
